# ---------------------------------------------------------------------------
# Conexión con Google Form + Google Sheet para recibir testimonios.
#
# Mientras `formUrl` y `csvUrl` estén vacíos, la web solo muestra los
# testimonios curados de testimonials.yaml y el botón enlaza a la página de
# contacto. Cuando los rellenes, aparecerá el botón al formulario y se cargarán
# automáticamente los testimonios APROBADOS de la hoja (sin recompilar la web).
#
# Cómo activarlo (ver README, sección "Testimonios"):
#   1. Crea un Google Form con las preguntas: Nombre, Cargo, Testimonio, Idioma.
#   2. En la hoja de respuestas vinculada, añade a mano una columna "Aprobado".
#   3. Publica esa hoja: Archivo > Compartir > Publicar en la web > CSV.
#   4. Pega aquí el enlace del formulario y el enlace CSV publicado.
# ---------------------------------------------------------------------------

# Enlace público del formulario (botón "Enviar un testimonio").
formUrl: "https://docs.google.com/forms/d/e/1FAIpQLSce1Hjrl3dNrxJ79_UIqN1BJbQMZSps6kX68xkCfRvT9LNVcw/viewform"

# URL CSV publicada de la hoja de respuestas
# (Archivo > Compartir > Publicar en la web > selecciona la hoja > CSV).
csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkV-09ERmRHb-MrZE1xxuSrmjbslgjFDTqC__5SNJkJq5L29RNoWGbEOA4_86ne7NLyPVsg0CFJyVs/pub?gid=1866167249&single=true&output=csv"

# Nombres EXACTOS de las cabeceras (primera fila) de la hoja.
# Ajusta estos valores si nombras las preguntas/columnas de otra forma.
columns:
  name: "Name"
  role: "Position"
  quote: "Testimonial"
  language: "Language"   # valores admitidos: English / Castellano (vacío = ambos)
  approved: "Aprobado"   # se muestra si vale: sí, si, yes, true, x, 1, verdadero
