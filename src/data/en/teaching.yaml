mentoring:
  - title: "Research-led supervision"
    description: >-
      Guiding students to frame applied research questions grounded in real
      tourism destinations and enterprises, from problem definition to defence.
  - title: "Methodological rigour"
    description: >-
      Emphasis on sound methodology — integrated evaluation procedures, service
      quality assessment and evidence-based decision-making.
  - title: "Professional impact"
    description: >-
      Theses designed to deliver actionable strategies for hotels, destinations
      and local institutions across the Jardines del Rey region and beyond.
