  - date: "2026-06-13"
    title: "Equipo mentorizado, ganador del reto Aqua-IA en el Techathon VIU 2026"
    summary: >-
      Con enorme orgullo: el equipo VOLTHA-IS, al que tuve el privilegio de
      mentorizar, ha resultado ganador del reto Aqua-IA en la segunda edición del
      Techathon VIU. Su proyecto, Blue Switch, plantea una capa de inteligencia
      climática capaz de optimizar dinámicamente las cargas de computación de IA
      mediante modelos predictivos, desplazándolas hacia momentos con energía más
      limpia o menor estrés térmico. Una solución 100% serverless y de baja
      latencia que puede reducir costes operativos en la nube y mejorar la
      sostenibilidad de infraestructuras críticas.
