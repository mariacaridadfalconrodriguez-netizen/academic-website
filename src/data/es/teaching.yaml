intro: >-
  Durante más de tres décadas he impartido docencia en programas de grado y
  posgrado de economía, empresa y gestión turística en la Universidad de Ciego
  de Ávila, diseñando asignaturas que conectan la teoría económica con la
  gestión práctica de los destinos turísticos.

