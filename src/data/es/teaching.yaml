mentoring:
  - title: "Dirección orientada a la investigación"
    description: >-
      Acompaño a los estudiantes para que planteen preguntas de investigación
      aplicada ancladas en destinos y empresas turísticas reales, desde la
      definición del problema hasta la defensa.
  - title: "Rigor metodológico"
    description: >-
      Énfasis en una metodología sólida: procedimientos de evaluación integrada,
      valoración de la calidad del servicio y toma de decisiones basada en
      evidencia.
  - title: "Impacto profesional"
    description: >-
      Tesis diseñadas para ofrecer estrategias accionables a hoteles, destinos e
      instituciones locales en la región de Jardines del Rey y más allá.
